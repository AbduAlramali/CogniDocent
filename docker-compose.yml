services:
  # ============================================================================
  # PostgreSQL with pgvector for Relational Data & Semantic Search
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cognidocent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cognidocent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cognidocent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis for Real-time PubSub Notifications & Caching
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: cognidocent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MinIO S3 Object Storage for Documents & Thumbnails
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: cognidocent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # RabbitMQ for Celery Asynchronous Event Publishing
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cognidocent-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================================
  # ClamAV Antivirus Daemon for Document Malware Scanning
  # ============================================================================
  clamav:
    image: clamav/clamav:latest
    container_name: cognidocent-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"

  # ============================================================================
  # Backend FastAPI Application
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognidocent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: CogniDocent
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cognidocent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ============================================================================
  # Frontend React SPA with Nginx
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: cognidocent-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
